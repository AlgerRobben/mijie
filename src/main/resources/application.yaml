server:
  port: 8081
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${HMDP_DB_URL:jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${HMDP_DB_USERNAME:root}
    password: ${HMDP_DB_PASSWORD:}
  redis:
    host: ${HMDP_REDIS_HOST:127.0.0.1}
    port: ${HMDP_REDIS_PORT:6379}
    password: ${HMDP_REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON输出时忽略值为null的字段
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug
hmdp:
  seckill:
    terminal-status-ttl-seconds: 604800
    stream-consumer:
      claim-idle: 30s
      recovery-interval: 5s
      max-deliveries: 5
  canal:
    enabled: ${HMDP_CANAL_ENABLED:false}
    name-server: ${HMDP_ROCKETMQ_NAMESRV:127.0.0.1:9876}
    topic: hmdp-shop-change
    consumer-group: hmdp-shop-cache
    max-reconsume-times: 8
  cache:
    broadcast-enabled: true
    load-wait: 2s
    redis-command-timeout: 300ms
    source-concurrency: 4
    replica-concurrency: 4
    internal-key-file: .local/cache-sync/internal-cache-key.txt
    hot:
      ids: ${HMDP_HOT_SHOP_IDS:10} # 固定HOT名单；启动时冻结，其他ID均为NORMAL。
      redis-logical-ttl-seconds: 1800
      local-logical-ttl-seconds: 5
      maximum-entries: 1000
      maximum-shops: 500
      maximum-snapshot-bytes: 8192
    edge-invalidate-urls: ${HMDP_EDGE_INVALIDATE_URLS:}

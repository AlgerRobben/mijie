worker_processes 1;
# 环境变量传给Lua读取Redis连接；密码由启动环境提供，不在这个配置文件写实际值。
env HMDP_REDIS_HOST;
env HMDP_REDIS_PORT;
env HMDP_REDIS_PASSWORD;
env HMDP_REDIS_DB;
env HMDP_CACHE_INTERNAL_KEY;
env HMDP_EDGE_LOGICAL_TTL_SECONDS;
env HMDP_HOT_MAX_SHOPS;
env HMDP_HOT_MAX_ENTRY_BYTES;
env HMDP_JAVA_HOST;
env HMDP_JAVA_PORT;

events { worker_connections 1024; }

http {
    include mime.types;
    # 10m约10MiB，仅存HOT正文；safe_set(...,0)不设物理TTL，5秒期限放在条目内部。
    lua_shared_dict shop_cache 10m;
    lua_shared_dict refresh_control 1m; # 刷新标记/容量计数独立，不挤占热点正文。
    lua_package_path "$prefix/conf/lua/?.lua;$prefix/lualib/?.lua;;";
    init_worker_by_lua_block {
        -- 每实例只一个worker启动完整名单预热；后续刷新均由请求或业务事件触发。
        if ngx.worker.id() == 0 then
            local ok, err = ngx.timer.at(0, require("hmdp_cache").warm_all)
            if not ok then ngx.log(ngx.ERR, "Cannot register HOT bootstrap: ", err) end
        end
    }

    server {
        listen 8080;

        location / {
            root html/hmdp;
            index index.html;
        }

        # 商铺详情才进入多级缓存，捕获的数字ID提供给Lua。
        location ~ ^/api/shop/([0-9]+)$ {
            set $shop_id $1;
            default_type application/json;
            content_by_lua_file conf/lua/shop.lua;
        }

        # 其他业务去掉前端/api前缀后转发Java，用户相关返回不进入公共shared_dict缓存。
        location /api/ {
            rewrite ^/api(/.*)$ $1 break;
            proxy_connect_timeout 1s;
            proxy_read_timeout 3s;
            proxy_pass http://127.0.0.1:8081;
        }

        # 内部维护接口不能通过普通/api代理把远端来源变成loopback。
        location ^~ /api/internal/ { return 404; }

        location = /internal/cache/stats {
            allow 127.0.0.1;
            deny all;
            content_by_lua_file conf/lua/cache_stats.lua;
        }

        # Java/CDC通知：HOT保留旧值并异步刷新，普通/删除退役；同时检查loopback和密钥。
        location ~ ^/internal/cache/shop/([0-9]+)$ {
            allow 127.0.0.1;
            deny all;
            if ($request_method != POST) { return 405; }
            set $shop_id $1;
            content_by_lua_file conf/lua/invalidate_shop.lua;
        }
    }
}
